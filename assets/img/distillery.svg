<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line illustration of the distillery by the river">
  <rect width="480" height="360" fill="none"/>
  <!-- sky hills -->
  <path d="M0 210 Q80 170 160 205 T320 195 T480 215 V360 H0 Z" fill="#1b1712"/>
  <path d="M0 240 Q100 200 220 235 T480 230 V360 H0 Z" fill="#201b14"/>

  <!-- river -->
  <path d="M0 300 Q120 280 240 302 T480 296 V360 H0 Z" fill="#141e1c" opacity="0.7"/>
  <path d="M0 300 Q120 280 240 302 T480 296" fill="none" stroke="#c9a25d" stroke-width="0.8" opacity="0.5"/>

  <!-- pagoda malt kiln -->
  <g stroke="#c9a25d" stroke-width="1.4" fill="none">
    <rect x="60" y="150" width="70" height="90"/>
    <path d="M55 150 L95 110 L135 150 Z"/>
    <rect x="88" y="95" width="14" height="20"/>
    <path d="M84 95 L95 78 L106 95 Z"/>
  </g>

  <!-- main distillery building -->
  <g stroke="#c9a25d" stroke-width="1.4" fill="none">
    <rect x="150" y="170" width="220" height="70"/>
    <path d="M150 170 L260 120 L370 170"/>
    <rect x="175" y="195" width="26" height="45"/>
    <rect x="215" y="195" width="26" height="45"/>
    <rect x="255" y="195" width="26" height="45"/>
    <rect x="295" y="195" width="26" height="45"/>
    <rect x="335" y="195" width="26" height="45"/>
  </g>

  <!-- chimney -->
  <rect x="330" y="130" width="14" height="45" fill="none" stroke="#c9a25d" stroke-width="1.4"/>

  <!-- warehouse row -->
  <g stroke="#a8632d" stroke-width="1.2" fill="none" opacity="0.85">
    <rect x="380" y="205" width="70" height="35"/>
    <path d="M380 205 L415 185 L450 205"/>
  </g>

  <!-- water reflection lines -->
  <g stroke="#c9a25d" stroke-width="0.6" opacity="0.35">
    <line x1="150" y1="255" x2="220" y2="255"/>
    <line x1="240" y1="262" x2="300" y2="262"/>
    <line x1="90" y1="268" x2="150" y2="268"/>
  </g>
</svg>
