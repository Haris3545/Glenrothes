<svg viewBox="0 0 240 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a whisky bottle and dram">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2a17" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7a4720" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a1d10" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="whisky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9852f"/>
      <stop offset="1" stop-color="#8a5220"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e9d8"/>
      <stop offset="1" stop-color="#e3d5b8"/>
    </linearGradient>
  </defs>

  <!-- bottle body -->
  <path d="M90 90 L90 60 Q90 40 110 40 L130 40 Q150 40 150 60 L150 90
           Q175 120 175 165 L175 470 Q175 495 150 495 L90 495 Q65 495 65 470
           L65 165 Q65 120 90 90 Z"
        fill="url(#glass)" stroke="#c9a25d" stroke-width="1.2" opacity="0.95"/>

  <!-- neck highlight -->
  <rect x="98" y="20" width="44" height="24" rx="4" fill="none" stroke="#c9a25d" stroke-width="1.2"/>

  <!-- whisky fill -->
  <path d="M67 300 Q67 300 175 300 L175 470 Q175 495 150 495 L90 495 Q65 495 65 470 Z"
        fill="url(#whisky)" opacity="0.85"/>

  <!-- label -->
  <rect x="78" y="230" width="84" height="150" fill="url(#label)" opacity="0.96"/>
  <rect x="78" y="230" width="84" height="150" fill="none" stroke="#a8632d" stroke-width="1"/>
  <line x1="90" y1="252" x2="150" y2="252" stroke="#a8632d" stroke-width="1"/>
  <text x="120" y="275" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="13" fill="#3a2a17" letter-spacing="0.5">THE</text>
  <text x="120" y="296" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="16" fill="#3a2a17" font-weight="700">GLENROTHES</text>
  <line x1="90" y1="308" x2="150" y2="308" stroke="#a8632d" stroke-width="1"/>
  <text x="120" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7a4720" letter-spacing="2">SPEYSIDE</text>
  <text x="120" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#7a4720" letter-spacing="2">SINGLE MALT</text>
  <circle cx="120" cy="362" r="10" fill="none" stroke="#a8632d" stroke-width="1"/>
  <text x="120" y="366" text-anchor="middle" font-family="Playfair Display, serif" font-size="9" fill="#a8632d">1879</text>

  <!-- cork cap -->
  <rect x="94" y="6" width="52" height="18" rx="3" fill="#12100c" stroke="#c9a25d" stroke-width="1"/>
</svg>
