<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Distillery</title>
<meta name="description" content="The Distillery. Please enter the password to continue.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/gate.css">
</head>
<body>
<a class="skip-link" href="#gate-form">Skip to password form</a>

<main class="gate-stage" id="gate-stage">

  <video
    class="bg-video is-current"
    id="bg-video-a"
    autoplay
    muted
    playsinline
    preload="auto"
    poster="assets/img/hero-video-poster.jpg"
    aria-hidden="true">
    <source src="assets/video/hero-loop.mp4" type="video/mp4">
  </video>
  <video
    class="bg-video"
    id="bg-video-b"
    muted
    playsinline
    preload="auto"
    aria-hidden="true">
    <source src="assets/video/hero-loop.mp4" type="video/mp4">
  </video>

  <div class="scrim" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <img class="corner-logo top-left" src="assets/img/vccp-logo-white.png" alt="VCCP Media">
  <img class="corner-logo top-right" src="assets/img/glenrothes-logo-white.png" alt="The Glenrothes, Established 1879">

  <div class="gate-content">
    <div class="brand-tag">
      <span>VCCP Media Cultural Intelligence</span>
    </div>

    <h1 class="gate-title">The Distillery</h1>
    <span class="gate-divider" aria-hidden="true"></span>

    <form class="gate-form" id="gate-form" autocomplete="off">
      <div class="password-field" id="password-field">
        <label for="gate-password" class="visually-hidden">Password</label>
        <input
          type="password"
          id="gate-password"
          name="password"
          placeholder="Password"
          required
          autofocus
          aria-describedby="gate-error">
        <button type="button" class="toggle-visibility" id="toggle-visibility" aria-label="Show password">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3.2"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3.2"/><path d="M3 3l18 18"/></svg>
        </button>
      </div>

      <button type="submit" class="btn-enter" id="btn-enter">Enter</button>

      <p class="gate-error" id="gate-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        Incorrect password. Please try again.
      </p>

      <span class="gate-success-badge" id="gate-success-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
        Access granted — entering&hellip;
      </span>
    </form>
  </div>

</main>

<script src="assets/js/video-loop.js"></script>
<script src="assets/js/gate.js"></script>
</body>
</html>
